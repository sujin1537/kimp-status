<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>김프 봇 현황판</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#161a21;--mut:#6b7280;--ln:#e5e7eb;--prem:#2563eb;--entry:#0e9f6e;--exit:#e8590c;--base:#8a94a6;--up:#d92d20;--dn:#1d6fe8;--tile:#f0f2f5}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101216;--card:#1a1b1e;--tx:#e9ecf1;--mut:#9aa3b2;--ln:#2a2d33;--prem:#5b8def;--entry:#2a9d70;--exit:#e0652a;--base:#9aa3b2;--up:#ff6b5e;--dn:#6aa8ff;--tile:#22252b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:17px;margin:0;font-weight:650}.upd{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-size:44px;line-height:1;font-weight:700;letter-spacing:-1px}.lab{color:var(--mut);font-size:12px;margin-bottom:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--tile);color:var(--tx)}
.pill.on{background:color-mix(in srgb,var(--entry) 16%,transparent);color:var(--entry)}.pill.off{background:color-mix(in srgb,var(--exit) 16%,transparent);color:var(--exit)}
.lines{display:flex;gap:18px;margin-top:14px;font-size:13px;color:var(--mut);flex-wrap:wrap}.lines b{color:var(--tx);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:var(--tile);border-radius:12px;padding:10px 12px}
.tile .v{font-size:19px;font-weight:650;margin-top:2px}.pos{color:var(--up)}.neg{color:var(--dn)}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
h2{font-size:14px;margin:0 0 12px;font-weight:650;display:flex;justify-content:space-between;align-items:center}h2 small{color:var(--mut);font-weight:400;font-size:12px}
#chart{position:relative}svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal-h button{border:1px solid var(--ln);background:var(--tile);color:var(--tx);border-radius:8px;width:32px;height:28px;font-size:15px;cursor:pointer}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-g .w{color:var(--mut);font-size:11px;text-align:center}
.cell{min-height:46px;border-radius:8px;padding:4px 2px;text-align:center;font-size:10px;background:var(--tile);color:var(--mut)}.cell .r{font-size:11px;font-weight:650;margin-top:2px;color:var(--tx)}.cell.t{outline:1.5px solid var(--prem)}
.cal-s{margin-top:10px;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 0;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}tr:last-child td{border-bottom:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{background:var(--tile);border-radius:99px;padding:3px 10px;font-size:12px}.chip span{color:var(--mut);margin-right:5px}
.note{color:var(--mut);font-size:11px;line-height:1.6;margin-top:18px}
</style></head><body><main>
<header><h1>김프 봇 <span id="mode" class="pill"></span></h1><span class="upd" id="upd">불러오는 중…</span></header>

<section class="card">
 <div class="hero"><div><div class="lab">현재 김프</div><div class="big" id="prem">-</div></div><span class="pill" id="state"></span></div>
 <div class="lines" id="lines"></div>
 <div class="legs" id="legs"></div>
</section>

<section class="card"><div class="tiles" id="tiles"></div></section>

<section class="card"><h2>최근 24시간 김프 <small id="cs24"></small></h2>
 <div id="chart"><svg id="svg" role="img" aria-label="최근 24시간 김프 차트"></svg><div class="tip" id="tip"></div></div>
 <div class="leg"><span><i style="border-color:var(--prem)"></i>김프</span><span><i style="border-color:var(--base);border-top-style:dotted"></i>기준선</span><span><i style="border-color:var(--entry);border-top-style:dashed"></i>진입선</span><span><i style="border-color:var(--exit);border-top-style:dashed"></i>청산선</span><span id="mylg"></span></div>
</section>

<section class="card"><h2>일별 마감 수익률</h2>
 <div class="cal-h"><button id="pm" aria-label="이전 달">‹</button><b id="ml" style="font-size:14px"></b><button id="nm" aria-label="다음 달">›</button></div>
 <div class="cal-g" id="cg"></div><div class="cal-s" id="cs"></div>
 <div class="chips" id="mo"></div>
</section>

<section class="card"><h2>최근 거래 <small id="ntr"></small></h2>
 <table><thead><tr><th>진입 → 청산</th><th>김프</th><th>수익률</th></tr></thead><tbody id="tr"></tbody></table></section>

<p class="note">개인이 자기 계좌로 운용하는 자동매매 기록을 보여주는 페이지입니다. 금액은 공개하지 않고 비율만 표시합니다.
투자 권유나 자문이 아니며, 과거 기록은 미래 수익을 보장하지 않습니다. 원금 손실이 날 수 있고, 각자 본인 책임으로 판단하세요.</p>
</main><script>
const $=id=>document.getElementById(id),f=(x,d=2)=>x==null?'-':(x>=0?'+':'')+x.toFixed(d)+'%',c=x=>x==null?'':x>=0?'pos':'neg';
let S=null;
fetch('status.json?_='+Date.now()).then(r=>r.json()).then(s=>{S=s;
$('mode').textContent=s.mode;$('upd').textContent=s.updated.slice(5)+' 갱신';
$('prem').textContent=s.prem==null?'-':s.prem.toFixed(2)+'%';
const st=$('state');st.textContent=s.state;st.className='pill '+(s.state==='포지션 보유 중'?'on':(s.state==='정지'||s.state==='환율 확인 중'?'off':''));
$('lines').innerHTML=[['기준선',s.base],['진입',s.entry],['청산',s.exit]].map(([k,v])=>`<span>${k} <b>${v==null?'-':v.toFixed(2)+'%'}</b></span>`).join('');
$('legs').innerHTML=s.legs?`<div class="tile"><div class="lab">업비트 롱 손익</div><div class="v ${c(s.legs.up)}">${f(s.legs.up)}</div></div><div class="tile"><div class="lab">바이낸스 숏 손익</div><div class="v ${c(s.legs.fut)}">${f(s.legs.fut)}</div></div>`:'';
$('tiles').innerHTML=[['오늘',s.today_ret],['이번 달',s.month_ret],['원금 대비',s.principal_ret!=null?s.principal_ret:(s.n_trades?s.realized_ret:null)]].map(([k,v])=>`<div class="tile"><div class="lab">${k}</div><div class="v ${c(v)}">${f(v)}</div></div>`).join('');
$('tr').innerHTML=s.trades.map(t=>`<tr><td>${t.in} → ${t.out}</td><td>${t.pin.toFixed(2)}→${t.pout.toFixed(2)}%</td><td class="${c(t.ret)}">${f(t.ret)}</td></tr>`).join('')||'<tr><td colspan=3 style="color:var(--mut)">아직 청산한 거래가 없습니다</td></tr>';
$('ntr').textContent=s.n_trades+'회';
$('mo').innerHTML=s.months.map(m=>`<span class="chip"><span>${m.m.slice(2)}</span><b class="${c(m.ret)}">${f(m.ret)}</b></span>`).join('');
chart();cal(s)}).catch(()=>{$('upd').textContent='불러오지 못했습니다'});
function cal(s){const D={};s.days.forEach(x=>D[x.d]=x);let[y,m]=s.today.split('-').map(Number);const start=[y,m];
const render=()=>{const first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate(),pad=first.getDay();let h=['일','월','화','수','목','금','토'].map(w=>`<div class="w">${w}</div>`).join(''),sum=1,cnt=0;
for(let i=0;i<pad;i++)h+='<div></div>';
for(let d=1;d<=dim;d++){const key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,x=D[key],isT=key===s.today;let bg='';
if(x){const a=Math.min(Math.abs(x.ret)/0.5,1)*.35+.08;bg=`background:${x.ret>=0?'rgba(217,45,32,'+a+')':'rgba(29,111,232,'+a+')'}`;if(!isT){sum*=1+x.ret/100;cnt++}}
h+=`<div class="cell ${isT?'t':''}" style="${bg}"><div>${d}</div><div class="r">${x?(isT?'진행':f(x.ret,2)):''}</div></div>`}
$('cg').innerHTML=h;$('ml').textContent=`${y}년 ${m}월`;
$('cs').textContent=cnt?`마감 ${cnt}일 · 일별 복리 합계 ${f((sum-1)*100,2)} (오늘은 진행 중이라 제외)`:'하루가 끝나면(한국시간 24시) 채워집니다.'};
$('pm').onclick=()=>{m--;if(m<1){m=12;y--}render()};$('nm').onclick=()=>{if(y==start[0]&&m==start[1])return;m++;if(m>12){m=1;y++}render()};render()}
function chart(){const s=S;if(!s||!s.series||s.series.length<2){return}
const sv=$('svg'),W=Math.min($('chart').clientWidth||600,640),H=Math.round(W*.58),L=38,R=44,T=10,B=22;sv.setAttribute('viewBox',`0 0 ${W} ${H}`);
const P=s.series,gap=(s.base!=null&&s.entry!=null)?s.base-s.entry:null,band=(s.base!=null&&s.exit!=null)?s.exit-s.base:null;
const ent=P.map(p=>p[2]==null||gap==null?null:p[2]-gap),ext=P.map(p=>p[2]==null||band==null?null:p[2]+band);
const vals=P.flatMap((p,i)=>[p[1],p[2],ent[i],ext[i]]).concat(s.my_entry==null?[]:[s.my_entry]).filter(v=>v!=null);
let lo=Math.min(...vals),hi=Math.max(...vals);const pd=(hi-lo)*.08||.1;lo-=pd;hi+=pd;
const X=i=>L+i/(P.length-1)*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
const path=(arr,i0=1)=>{let d='',on=0;P.forEach((p,i)=>{const v=i0===-1?arr[i]:p[i0];if(v==null){on=0;return}d+=(on?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);on=1});return d};
let g='';const nt=4;for(let k=0;k<=nt;k++){const v=lo+(hi-lo)*k/nt;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col('--ln')}" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="${col('--mut')}">${v.toFixed(1)}</text>`}
const tk=[0,.25,.5,.75,1].map(r=>Math.round(r*(P.length-1)));tk.forEach((i,j)=>{g+=`<text x="${X(i)}" y="${H-5}" text-anchor="${j==0?'start':j==4?'end':'middle'}" font-size="11" fill="${col('--mut')}">${P[i][0].slice(6)}</text>`});
g+=`<path d="${path(null,2)}" fill="none" stroke="${col('--base')}" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>`;
g+=`<path d="${path(ent,-1)}" fill="none" stroke="${col('--entry')}" stroke-width="1.5" stroke-dasharray="6 4"/>`;
g+=`<path d="${path(ext,-1)}" fill="none" stroke="${col('--exit')}" stroke-width="1.5" stroke-dasharray="6 4"/>`;
if(s.my_entry!=null){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(s.my_entry)}" y2="${Y(s.my_entry)}" stroke="${col('--entry')}" stroke-width="1.5"/><text x="${W-R+4}" y="${Y(s.my_entry)+4}" font-size="11" font-weight="600" fill="${col('--entry')}">내 진입</text>`;$('mylg').innerHTML=`<span><i style="border-color:var(--entry)"></i>내 진입 ${s.my_entry.toFixed(2)}%</span>`}
g+=`<path d="${path(null,1)}" fill="none" stroke="${col('--prem')}" stroke-width="2" stroke-linejoin="round"/>`;
const last=P.length-1;g+=`<circle cx="${X(last)}" cy="${Y(P[last][1])}" r="4" fill="${col('--prem')}" stroke="${col('--card')}" stroke-width="2"/>`;
g+=`<g id="xh" style="display:none"><line id="xl" y1="${T}" y2="${H-B}" stroke="${col('--mut')}" stroke-width="1"/><circle id="xc" r="4.5" fill="${col('--prem')}" stroke="${col('--card')}" stroke-width="2"/></g><rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
sv.innerHTML=g;
const tip=$('tip'),hit=$('hit'),xh=$('xh');
const mv=e=>{const r=sv.getBoundingClientRect(),px=(e.clientX-r.left)*(W/r.width),i=Math.max(0,Math.min(last,Math.round((px-L)/(W-L-R)*last))),p=P[i];
xh.style.display='';$('xl').setAttribute('x1',X(i));$('xl').setAttribute('x2',X(i));$('xc').setAttribute('cx',X(i));$('xc').setAttribute('cy',Y(p[1]));
tip.innerHTML=`<b>${p[1].toFixed(2)}%</b> <span style="color:var(--mut)">${p[0].slice(6)}</span><br><span style="color:var(--mut)">기준선 ${p[2]==null?'-':p[2].toFixed(2)+'%'}</span>`;tip.style.display='block';
const tw=tip.offsetWidth,x=(X(i)/W)*r.width;tip.style.left=Math.max(0,Math.min(r.width-tw,x-tw/2))+'px';tip.style.top='-6px'};
hit.addEventListener('pointermove',mv);hit.addEventListener('pointerdown',mv);hit.addEventListener('pointerleave',()=>{xh.style.display='none';tip.style.display='none'});
const lastP=P[last][1];$('cs24').textContent=`최저 ${Math.min(...P.map(p=>p[1])).toFixed(2)}% · 최고 ${Math.max(...P.map(p=>p[1])).toFixed(2)}%`}
addEventListener('resize',()=>chart());
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>봇 총괄</title><style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#161a21;--mut:#6b7280;--ln:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1a1b1e;--tx:#e9ecf1;--mut:#9aa3b2;--ln:#2a2d33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}h1{font-size:17px;margin:0 0 4px}.upd{color:var(--mut);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.nm{font-weight:650}.md{color:var(--mut);font-size:12px;margin-left:6px}
.st{font-size:13px;white-space:nowrap}.hl{color:var(--mut);font-size:13px;margin-top:4px;word-break:keep-all}
.a a{color:var(--mut);font-size:12px}
</style></head><body><main><h1>봇 총괄</h1><div class="upd" id="u">불러오는 중…</div><div id="l"></div>
<div class="a upd"><a href="./">김프 현황판</a></div></main>
<script>
const rp=location.hostname.split('.')[0]+'/'+location.pathname.split('/')[1];
const I={"정상":"🟢","확인됨":"🟢","지연":"🟡","멈춤":"🔴","일시정지":"⏸","미가동":"⚪","오래됨":"🟡","읽기 실패":"🔴"};
const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('https://raw.githubusercontent.com/'+rp+'/data/hub.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(s=>{
document.getElementById('u').textContent='갱신 '+s.ts+' (KST) · 금액 없이 상태·비율만 표시';
document.getElementById('l').innerHTML=s.bots.map(b=>`<div class="card"><div class="row"><div><span class="nm">${e(b.name)}</span><span class="md">${e(b.mode||'')}</span></div><div class="st">${I[b.state]||'⚪'} ${e(b.state)}</div></div><div class="hl">${e(b.headline||'')}</div></div>`).join('');
}).catch(()=>{document.getElementById('u').textContent='불러오지 못했습니다'});
</script></body></html>
